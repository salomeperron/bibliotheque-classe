<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bibliothèque de classe</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2563eb">

<style>

:root{
  --primary:#2563eb;
  --success:#16a34a;
  --danger:#dc2626;
  --bg:#f5f7fb;
}

*{
  box-sizing:border-box;
  font-family:Segoe UI,Arial,sans-serif;
}

body{
  margin:0;
  background:var(--bg);
}

header{
  background:#2563eb;
  color:white;
  padding:20px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:16px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.grid{
  display:grid;
  gap:20px;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
}

input,
select,
textarea{
  width:100%;
  padding:10px;
  margin:6px 0 10px 0;
}

button{
  border:none;
  border-radius:8px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:bold;
}

.primary{
  background:var(--primary);
  color:white;
}

.success{
  background:var(--success);
  color:white;
}

.danger{
  background:var(--danger);
  color:white;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
}

.stat{
  text-align:center;
}

.badge{
  padding:4px 10px;
  border-radius:999px;
  background:#e5e7eb;
}

.comment{
  margin-top:10px;
  padding:10px;
  background:#f3f4f6;
  border-radius:8px;
}

footer{
  text-align:center;
  padding:20px;
  color:#666;
}

</style>
</head>
<body>

<header>
<h1>📚 Bibliothèque de classe</h1>
</header>

<div class="container">

<div class="grid">

<div class="card stat">
<h3>Livres</h3>
<h1 id="statLivres">0</h1>
</div>

<div class="card stat">
<h3>Emprunts</h3>
<h1 id="statEmprunts">0</h1>
</div>

<div class="card stat">
<h3>Disponibles</h3>
<h1 id="statDisponibles">0</h1>
</div>

</div>

<div class="card">

<h2>Utilisateur</h2>

<input
id="userName"
placeholder="Nom">

<button
class="primary"
onclick="connexion()">
Connexion
</button>

<p id="currentUser"></p>

<button
id="installBtn"
class="success"
style="display:none">
Installer l'application
</button>

</div>

<div class="grid">

<div class="card">

<h2>Ajouter un livre</h2>

<input id="livreTitre" placeholder="Titre">

<input id="livreAuteur" placeholder="Auteur">

<select id="livreGenre">
<option value="Roman">Roman</option>
<option value="BD">BD</option>
